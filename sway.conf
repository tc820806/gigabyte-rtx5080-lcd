# GPU LCD (AORUS RTX 5080 Master ICE): the panel always powers up in its own rotation mode (0x0B, image <-> chibi),
# whatever was saved. One mode-3 command after login switches it to the stored static image (slot 0x01300000) and it
# stays there until the next power-off or suspend (a warm reboot keeps it). One-shot, exits right away; not a service.
# After suspend, swayidle's after-resume runs the same script (see README).
# Include this file from your sway config (see README). Remove it to undo; the stored image is unaffected.
exec $HOME/Projects/gigabyte-rtx5080-lcd/resume.sh
